services:
  flux-3-image-klein:
    build: .
    ports:
      - "8001:8000"
    environment:
      API_TOKEN: ${API_TOKEN:-}
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-10}
      HISTORY_SIZE: ${HISTORY_SIZE:-100}
      FLUX_UPSAMPLER_GPU_GIB: ${FLUX_UPSAMPLER_GPU_GIB:-6}
      FLUX_UPSAMPLER_CPU_GIB: ${FLUX_UPSAMPLER_CPU_GIB:-8}
      FLUX_UPSAMPLER_MAX_TOKENS: ${FLUX_UPSAMPLER_MAX_TOKENS:-1024}
      INFERENCE_STEPS: ${INFERENCE_STEPS:-16}
      HF_MODEL_ID: ${HF_MODEL_ID:-black-forest-labs/flux-3-image-klein}
      HF_MODEL_REVISION: ${HF_MODEL_REVISION:-main}
      HF_TOKEN: ${HF_TOKEN:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-157286400}
      MAX_REFERENCE_BYTES: ${MAX_REFERENCE_BYTES:-10485760}
      MAX_REFERENCE_PIXELS: ${MAX_REFERENCE_PIXELS:-40000000}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_RETRIES: ${WEBHOOK_RETRIES:-5}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10}
    volumes:
      - flux-3-models:/data
    gpus: all
    restart: unless-stopped
volumes:
  flux-3-models:
