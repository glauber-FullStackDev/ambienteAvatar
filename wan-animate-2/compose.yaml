x-wan-animate-2-image: &wan-animate-2-image
  image: ${WAN_ANIMATE_2_IMAGE:-wan-animate-2:latest}
  platform: linux/amd64
  build:
    context: .
    args:
      PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime}
      INSTALL_MANAGER: ${INSTALL_MANAGER:-1}

x-wan-animate-2-volumes: &wan-animate-2-volumes
  - ./data/models:/models
  - ./data/input:/opt/ComfyUI/input
  - ./data/output:/opt/ComfyUI/output
  - ./data/user:/opt/ComfyUI/user
  - ./data/cache:/data/cache

services:
  wan-animate-2:
    <<: *wan-animate-2-image
    gpus: all
    ports:
      - "${WAN_ANIMATE_2_BIND:-127.0.0.1}:${WAN_ANIMATE_2_PORT:-8188}:8188"
    volumes: *wan-animate-2-volumes
    environment:
      COMFYUI_ARGS: ${COMFYUI_ARGS:---preview-method auto}
      COMFYUI_MODELS: /models
      COMFYUI_PORT: "8188"
      DOWNLOAD_MODELS_ON_START: ${DOWNLOAD_MODELS_ON_START:-0}
      HF_HOME: /data/cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    shm_size: ${SHM_SIZE:-32gb}
    restart: unless-stopped
    stop_grace_period: 30s

  download-models:
    <<: *wan-animate-2-image
    profiles: [tools]
    command: ["download-models"]
    volumes: *wan-animate-2-volumes
    environment:
      COMFYUI_MODELS: /models
      HF_HOME: /data/cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}

  verify:
    <<: *wan-animate-2-image
    profiles: [tools]
    command: ["verify"]
    volumes: *wan-animate-2-volumes
    environment:
      COMFYUI_MODELS: /models
