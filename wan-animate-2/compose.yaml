x-wan-animate-2-image: &wan-animate-2-image
  image: ${WAN_ANIMATE_2_IMAGE:-wan-animate-2:latest}
  platform: linux/amd64
  build:
    context: .
    args:
      PYTORCH_DEVEL_IMAGE: ${PYTORCH_DEVEL_IMAGE:-pytorch/pytorch:2.7.1-cuda12.6-cudnn9-devel}
      PYTORCH_RUNTIME_IMAGE: ${PYTORCH_RUNTIME_IMAGE:-pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime}

x-wan-animate-2-volumes: &wan-animate-2-volumes
  - ./data/models:/models
  - ./data/output:/outputs
  - ./data/cache:/data/cache

services:
  wan-animate-2:
    <<: *wan-animate-2-image
    gpus: all
    ports:
      - "${WAN_ANIMATE_2_BIND:-127.0.0.1}:${WAN_ANIMATE_2_PORT:-8188}:8188"
    volumes: *wan-animate-2-volumes
    environment:
      APP_PORT: "8188"
      DOWNLOAD_MODELS_ON_START: ${DOWNLOAD_MODELS_ON_START:-0}
      HF_HOME: /data/cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_VARIANT: ${MODEL_VARIANT:-base}
      OUTPUT_DIR: /outputs
    shm_size: ${SHM_SIZE:-32gb}
    restart: unless-stopped
    stop_grace_period: 30s

  download-models:
    <<: *wan-animate-2-image
    profiles: [tools]
    command: ["download-models"]
    volumes: *wan-animate-2-volumes
    environment:
      HF_HOME: /data/cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_VARIANT: ${MODEL_VARIANT:-base}

  verify:
    <<: *wan-animate-2-image
    profiles: [tools]
    command: ["verify"]
    volumes: *wan-animate-2-volumes
    environment:
      MODEL_VARIANT: ${MODEL_VARIANT:-base}
