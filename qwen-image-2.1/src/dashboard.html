<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qwen — Fila de geração</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0d1117;color:#e6edf3;font:14px/1.5 system-ui,sans-serif;max-width:1000px;margin:auto;padding:24px}h1{margin:0;font-size:22px}h2{font-size:14px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em}p,.muted{color:#8b949e}.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;margin:18px 0}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{border:1px solid #30363d;border-radius:999px;padding:3px 10px}.bar{background:#30363d;height:12px;border-radius:6px;overflow:hidden;margin:10px 0}.bar div{background:#58a6ff;height:100%}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #30363d;padding:9px}th{color:#8b949e}.scroll{overflow:auto}input,button{padding:10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#e6edf3}button{background:#1f6feb;cursor:pointer}#error{color:#f85149}.prompt{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body><h1>🖼️ Qwen — Fila de geração</h1><p>Qwen-Image-2.1 · API síncrona</p><div class="badges"><span class="badge" id="worker">Modelo: —</span><span class="badge" id="counts">—</span></div><p id="error"></p><div id="gate" class="card" hidden><h2>Acesso</h2><p>Informe o API_TOKEN para acompanhar as solicitações.</p><input id="token" type="password" autocomplete="off" placeholder="API_TOKEN"><button id="login">Entrar</button></div><main id="content"><section class="card"><h2>Solicitação atual</h2><div id="current" class="muted">Nenhuma geração em andamento.</div></section><section class="card"><h2>Fila e histórico</h2><div class="scroll"><table><thead><tr><th>ID</th><th>Status</th><th>Progresso</th><th>Tempo</th><th>Prompt</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const key='qwen_dashboard_token', $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), duration=x=>x==null?'—':`${Math.floor(x/60)}m ${Math.floor(x%60)}s`;
const phases={queued:'Na fila',running:'Em andamento',loading_references:'Carregando referências',preparing:'Preparando geração',sampling:'Gerando imagem',decoding:'Decodificando imagem',encoding:'Codificando PNG',completed:'Concluído',failed:'Falhou',cancelled:'Cliente desconectado'};
$('login').onclick=()=>{sessionStorage.setItem(key,$('token').value);load()};
function detail(j){const p=j.progress||{}, phase=phases[p.phase]||p.phase||'—';return `${esc(phase)}${p.percent==null?'':` · ${p.percent}% (${p.step}/${p.total_steps})`}`}
async function load(){try{const r=await fetch('/dashboard/api/summary',{headers:{Authorization:'Bearer '+(sessionStorage.getItem(key)||'')}});if(r.status===401){$('gate').hidden=false;$('content').hidden=true;return}if(!r.ok)throw Error('HTTP '+r.status);$('gate').hidden=true;$('content').hidden=false;$('error').textContent='';const d=await r.json(), w=d.worker, c=d.counts;$('worker').textContent=w.ready?(w.busy?'Modelo: processando':'Modelo: pronto'):'Modelo: carregando ou indisponível';$('counts').textContent=`${c.queued} na fila · ${c.running} em andamento · ${c.completed} geradas · ${c.failed} falhas · ${c.cancelled} desconectadas`;const j=d.current;if(j){const p=j.progress||{}, elapsed=Date.now()/1000-j.started_at;$('current').innerHTML=`<div>${detail(j)}</div>${p.percent==null?'':`<div class="bar"><div style="width:${Math.max(0,Math.min(100,p.percent))}%"></div></div>`}<p>Solicitação ${esc(j.job_id.slice(0,8))} · decorrido ${duration(elapsed)}</p><div class="prompt" title="${esc(j.prompt)}">${esc(j.prompt)}</div>`}else $('current').textContent='Nenhuma geração em andamento.';const rows=[...(d.current?[d.current]:[]),...d.queue,...d.history];$('rows').innerHTML=rows.length?rows.map(j=>`<tr><td><code>${esc(j.job_id.slice(0,8))}</code></td><td>${esc(phases[j.status]||j.status)}${j.queue_position?' · '+j.queue_position+'º':''}${j.error?' · '+esc(j.error):''}</td><td>${detail(j)}</td><td>${duration(j.started_at?(j.finished_at||Date.now()/1000)-j.started_at:null)}</td><td class="prompt" title="${esc(j.prompt)}">${esc(j.prompt)}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">Nenhuma solicitação nesta sessão.</td></tr>'}catch(e){$('error').textContent='Não foi possível atualizar o painel.'}}
load();setInterval(load,1500);
</script></body></html>
