name: Build and publish Z-Image-Turbo

on:
  push:
    branches: [main]
    paths:
      - 'z-image-turbo/**'

concurrency:
  group: publish-z-image-turbo
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python for API tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Test API and queue
        run: |
          python -m pip install 'fastapi==0.115.12' 'pillow>=11,<13' 'urllib3>=2.2,<3' 'httpx>=0.27,<1'
          python -m unittest discover -s z-image-turbo/tests -v

      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: |
          image_name="${GITHUB_REPOSITORY,,}-z-image-turbo"
          echo "name=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Z-Image-Turbo API
            org.opencontainers.image.description=Synchronous image generation and editing API with dashboard
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: ./z-image-turbo
          file: ./z-image-turbo/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=z-image-turbo
          cache-to: type=gha,mode=max,scope=z-image-turbo
