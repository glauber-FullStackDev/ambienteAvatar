name: Build and publish MiniMax H3 FL2VA

on:
  push:
    branches: [main]
    paths:
      - 'minimax-h3-fl2va/**'

concurrency:
  group: publish-minimax-h3-fl2va
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Validate Python and workflow graph
        run: python3 -m unittest discover -s minimax-h3-fl2va/tests -v

      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: |
          image_name="${GITHUB_REPOSITORY,,}-minimax-h3-fl2va"
          echo "name=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=MiniMax H3 FL2VA API
            org.opencontainers.image.description=ComfyUI MiniMax H3 FL2VA pipeline
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: ./minimax-h3-fl2va
          file: ./minimax-h3-fl2va/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=minimax-h3-fl2va
          cache-to: type=gha,mode=max,scope=minimax-h3-fl2va
