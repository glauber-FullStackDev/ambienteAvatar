name: Build and publish LTX 2.3 GGUF 16GB Serverless image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ltx23-16gb-serverless-image.yml
      - ltx-2.3-16gb/**
      - ltx-2.3-16gb-serverless/**
  workflow_dispatch:
    inputs:
      image_tag:
        description: Additional image tag
        required: false
        default: ""
        type: string

concurrency:
  group: publish-ltx23-16gb-serverless-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: |
          image_name="${GITHUB_REPOSITORY,,}-ltx23-16gb-serverless"
          echo "name=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=v1.0
            type=raw,value=latest
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=LTX 2.3 IA2V GGUF 16GB Serverless
            org.opencontainers.image.description=Local Docker API worker (FastAPI) for LTX 2.3 IA2V Personal LoRA with the GGUF 16 GB model set, MinIO output and completion webhook
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./ltx-2.3-16gb-serverless/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LTX_IMAGE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ltx23-16gb-serverless
          cache-to: type=gha,mode=max,scope=ltx23-16gb-serverless
